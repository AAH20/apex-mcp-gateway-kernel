[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-mcp-gateway-kernel"
version = "0.1.0"
description = "Algorithmic NP-Hard Optimization Kernel for Model Context Protocol (MCP) Gateways, KV-Cache Prefix Routing, Conformal Model Cascading, and Deadlock-Free Multi-Agent Scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
apex-mcp-gateway = "apex_mcp_gateway_kernel.cli:main"
